<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區管理費未繳費篩選工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-xl p-6 md:p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">🏠 未繳費戶別篩選工具</h1>
        <p class="text-sm text-gray-600 mb-6">請從 Google 試算表或 Excel 中複製資料（包含「戶別」、「最近一次繳費」、「本月繳費」三欄），直接貼至下方文字框中。</p>

        <!-- 輸入區 -->
        <div class="mb-6">
            <label for="pastedData" class="block text-sm font-semibold text-gray-700 mb-2">貼上試算表資料：</label>
            <textarea id="pastedData" rows="6" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm font-mono" placeholder="範例：
2A	8月31日	10月2日
4F	9月30日	
5A	9月28日	"></textarea>
            <div class="flex gap-3 mt-3">
                <button onclick="processData()" class="px-5 py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition shadow-sm">開始篩選未繳費</button>
                <button onclick="clearData()" class="px-4 py-2.5 bg-gray-200 text-gray-700 font-medium rounded-lg hover:bg-gray-300 transition">清空重來</button>
            </div>
        </div>

        <!-- 統計摘要 -->
        <div id="statsSection" class="hidden grid grid-cols-3 gap-4 mb-6">
            <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 text-center">
                <div class="text-xs text-blue-600 font-semibold">總戶數</div>
                <div id="statTotal" class="text-xl font-bold text-blue-900 mt-1">0</div>
            </div>
            <div class="bg-green-50 p-4 rounded-lg border border-green-100 text-center">
                <div class="text-xs text-green-600 font-semibold">已繳費戶數</div>
                <div id="statPaid" class="text-xl font-bold text-green-900 mt-1">0</div>
            </div>
            <div class="bg-red-50 p-4 rounded-lg border border-red-100 text-center">
                <div class="text-xs text-red-600 font-semibold">未繳費戶數</div>
                <div id="statUnpaid" class="text-xl font-bold text-red-900 mt-1">0</div>
            </div>
        </div>

        <!-- 結果區 -->
        <div id="resultSection" class="hidden">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold text-gray-800">⚠️ 未繳費戶別與近期繳費紀錄</h2>
                <button onclick="copyResults()" class="px-3 py-1.5 bg-gray-800 text-white text-xs font-medium rounded hover:bg-gray-700 transition">複製結果文字</button>
            </div>
            <div class="border border-gray-200 rounded-lg overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-xs font-semibold text-gray-600 uppercase">
                            <th class="p-3 border-b">戶別</th>
                            <th class="p-3 border-b">備註（近期繳費日期）</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody" class="divide-y divide-gray-200 text-sm">
                        <!-- 動態插入 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function processData() {
            const rawText = document.getElementById('pastedData').value.trim();
            if (!rawText) {
                alert('請先貼上資料！');
                return;
            }

            const lines = rawText.split('\n');
            let total = 0;
            let paidCount = 0;
            const unpaidList = [];

            lines.forEach((line, index) => {
                const cols = line.split('\t').map(c => c.trim());
                if (cols.length < 2) return;

                // 自動略過標題列
                if (index === 0 && (cols[0].includes('戶別') || cols[0].includes('單'))) {
                    return;
                }

                const unit = cols[0];
                const recentPay = cols[1] || '';
                const currentMonthPay = cols[2] || ''; // 若第三欄為空則視為未繳

                if (!unit) return;

                total++;

                // 判斷本月繳費是否有填寫日期
                const isPaid = currentMonthPay !== '' && currentMonthPay !== '-' && currentMonthPay !== '無';

                if (isPaid) {
                    paidCount++;
                } else {
                    unpaidList.push({ unit, recentPay });
                }
            });

            // 更新統計數據
            document.getElementById('statTotal').innerText = total;
            document.getElementById('statPaid').innerText = paidCount;
            document.getElementById('statUnpaid').innerText = unpaidList.length;
            document.getElementById('statsSection').classList.remove('hidden');

            // 渲染表格
            const tbody = document.getElementById('resultTableBody');
            tbody.innerHTML = '';

            if (unpaidList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" class="p-4 text-center text-gray-500">太棒了！所有戶別皆已完成繳費。</td></tr>`;
            } else {
                unpaidList.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50';
                    tr.innerHTML = `
                        <td class="p-3 font-semibold text-red-600">${item.unit}</td>
                        <td class="p-3 text-gray-600">${item.recentPay ? item.recentPay : '無近期紀錄'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('resultSection').classList.remove('hidden');
        }

        function clearData() {
            document.getElementById('pastedData').value = '';
            document.getElementById('statsSection').classList.add('hidden');
            document.getElementById('resultSection').classList.add('hidden');
        }

        function copyResults() {
            const rows = document.querySelectorAll('#resultTableBody tr');
            let text = '【未繳費戶別清單】\n';
            rows.forEach(row => {
                const cols = row.querySelectorAll('td');
                if (cols.length >= 2) {
                    text += `${cols[0].innerText.trim()}\t近期繳費：${cols[1].innerText.trim()}\n`;
                }
            });

            navigator.clipboard.writeText(text).then(() => {
                alert('已成功複製未繳費清單！');
            });
        }
    </script>
</body>
</html>
